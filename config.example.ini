# Jira API Configuration Example
# Copy this file to 'config.ini' and fill in your details

[jira]
# Your Jira instance URL (e.g., https://your-company.atlassian.net)
base_url = https://your-instance.atlassian.net

# Your Jira email address
email = your-email@example.com

# Your Jira API token (generate from: https://id.atlassian.com/manage-profile/security/api-tokens)
# IMPORTANT: Never commit the actual config.ini file with your real API token
api_token = your-api-token-here

# The Jira project key to query (e.g., PROJ, DEV, etc.)
project_key = PROJ

[report]
# Output directory for generated reports
output_dir = reports

# Default report format: csv or pdf (or both)
default_format = csv
